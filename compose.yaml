name: minimal-bank-system-fnd05

services:
  postgres:
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    platform: linux/amd64
    environment:
      POSTGRES_DB: minimal_bank
      POSTGRES_USER: mbs_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/bootstrap_password
    secrets:
      - source: bootstrap_password
        target: bootstrap_password
      - source: migrator_password
        target: migrator_password
      - source: api_password
        target: api_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deployment/postgres/init-roles.sh:/docker-entrypoint-initdb.d/01-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=\"$${POSTGRES_USER}\" --dbname=\"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrator:
    build:
      context: .
      dockerfile: src/MinimalBankSystem.Migrator/Dockerfile
      args:
        SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0-noble@sha256:72dd743782f2ae7e5476fd64f6a460045e3998dc862218b80e6944cba79a01b0
        RUNTIME_IMAGE: mcr.microsoft.com/dotnet/aspnet:10.0-noble@sha256:f1126d438ccc359f51cc6d4701a8deae513856cf10f5fe645d29ea6403dcac6b
    platform: linux/amd64
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: minimal_bank
      POSTGRES_USERNAME: mbs_migrator
      MBS_DATABASE_PASSWORD_FILE: /run/secrets/migrator_password
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - source: migrator_password
        target: migrator_password
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/MinimalBankSystem.Api/Dockerfile
      args:
        SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0-noble@sha256:72dd743782f2ae7e5476fd64f6a460045e3998dc862218b80e6944cba79a01b0
        RUNTIME_IMAGE: mcr.microsoft.com/dotnet/aspnet:10.0-noble@sha256:f1126d438ccc359f51cc6d4701a8deae513856cf10f5fe645d29ea6403dcac6b
    platform: linux/amd64
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: minimal_bank
      POSTGRES_USERNAME: mbs_api
      MBS_DATABASE_PASSWORD_FILE: /run/secrets/api_password
    depends_on:
      migrator:
        condition: service_completed_successfully
    secrets:
      - source: api_password
        target: api_password
    # API health is readiness, not merely a live process or an open TCP port. The shipped runtime
    # image already contains bash, so this probe needs no extra package or helper executable.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && IFS= read -r status <&3 && [[ $$status == "HTTP/1.1 200 "* ]]'
      interval: 5s
      # The probe remains alive long enough to observe the readiness check's bounded 10-second
      # failure response instead of terminating the request before it can return 503.
      timeout: 15s
      retries: 3
      start_period: 20s

secrets:
  bootstrap_password:
    environment: MBS_BOOTSTRAP_PASSWORD
  migrator_password:
    environment: MBS_MIGRATOR_PASSWORD
  api_password:
    environment: MBS_API_PASSWORD

volumes:
  postgres_data:
