# FND-05 canonical Compose runtime (Issue #43 / D-01..D-07).
# Project identity for lifecycle commands: minimal-bank-system-fnd05
name: minimal-bank-system-fnd05

services:
  postgres:
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    platform: linux/amd64
    environment:
      POSTGRES_USER: mbs
      POSTGRES_DB: minimal_bank
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mbs -d minimal_bank"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - runtime

  migrator:
    build:
      context: .
      dockerfile: src/MinimalBankSystem.Migrator/Dockerfile
    image: minimal-bank-system-migrator:fnd05
    platform: linux/amd64
    environment:
      MBS_DB_HOST: postgres
      MBS_DB_PORT: "5432"
      MBS_DB_NAME: minimal_bank
      MBS_DB_USER: mbs
      MBS_DB_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - runtime
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/MinimalBankSystem.Api/Dockerfile
    image: minimal-bank-system-api:fnd05
    platform: linux/amd64
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      MBS_DB_HOST: postgres
      MBS_DB_PORT: "5432"
      MBS_DB_NAME: minimal_bank
      MBS_DB_USER: mbs
      MBS_DB_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks:
      - runtime

secrets:
  database_password:
    environment: MBS_DATABASE_PASSWORD

volumes:
  postgres_data:

networks:
  runtime:
