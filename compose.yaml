name: minimal-bank-system-fnd05

services:
  postgres:
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    platform: linux/amd64
    environment:
      POSTGRES_DB: minimal_bank
      # The bootstrap principal is the PostgreSQL server's own initial superuser. It provisions the
      # least-privilege Migrator and API runtime roles below and is never handed to either service.
      POSTGRES_USER: minimal_bank_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/database_bootstrap_password
      MBS_MIGRATOR_ROLE: minimal_bank_migrator
      MBS_API_ROLE: minimal_bank_api
      MBS_MIGRATOR_PASSWORD_FILE: /run/secrets/database_migrator_password
      MBS_API_PASSWORD_FILE: /run/secrets/database_api_password
    secrets:
      - source: database_bootstrap_password
        target: database_bootstrap_password
      - source: database_migrator_password
        target: database_migrator_password
      - source: database_api_password
        target: database_api_password
    volumes:
      - postgres_data:/var/lib/postgresql
      # Bootstrap-only role/privilege provisioning. docker-entrypoint-initdb.d scripts run exactly
      # once, only against an empty data directory, using the bootstrap superuser above.
      - ./deployment/db-bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=\"$${POSTGRES_USER}\" --dbname=\"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrator:
    build:
      context: .
      dockerfile: src/MinimalBankSystem.Migrator/Dockerfile
      args:
        SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0-noble@sha256:72dd743782f2ae7e5476fd64f6a460045e3998dc862218b80e6944cba79a01b0
        RUNTIME_IMAGE: mcr.microsoft.com/dotnet/aspnet:10.0-noble@sha256:f1126d438ccc359f51cc6d4701a8deae513856cf10f5fe645d29ea6403dcac6b
    platform: linux/amd64
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: minimal_bank
      POSTGRES_USERNAME: minimal_bank_migrator
      # Requests WP2-DB-01 privilege-boundary enforcement: after each run, the Migrator narrows
      # this role's access to the EF migration-history table down to SELECT-only.
      MBS_API_RUNTIME_ROLE: minimal_bank_api
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - source: database_migrator_password
        target: database_password
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/MinimalBankSystem.Api/Dockerfile
      args:
        SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0-noble@sha256:72dd743782f2ae7e5476fd64f6a460045e3998dc862218b80e6944cba79a01b0
        RUNTIME_IMAGE: mcr.microsoft.com/dotnet/aspnet:10.0-noble@sha256:f1126d438ccc359f51cc6d4701a8deae513856cf10f5fe645d29ea6403dcac6b
    platform: linux/amd64
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: minimal_bank
      POSTGRES_USERNAME: minimal_bank_api
    depends_on:
      migrator:
        condition: service_completed_successfully
    secrets:
      - source: database_api_password
        target: database_password
      - source: jwt_signing_key
        target: jwt_signing_key
    # API health is readiness, not merely a live process or an open TCP port. The shipped runtime
    # image already contains bash, so this probe needs no extra package or helper executable.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && IFS= read -r status <&3 && [[ $$status == "HTTP/1.1 200 "* ]]'
      interval: 5s
      # The probe remains alive long enough to observe the readiness check's bounded 10-second
      # failure response instead of terminating the request before it can return 503.
      timeout: 15s
      retries: 3
      start_period: 20s

secrets:
  database_bootstrap_password:
    environment: MBS_DATABASE_BOOTSTRAP_PASSWORD
  database_migrator_password:
    environment: MBS_DATABASE_MIGRATOR_PASSWORD
  database_api_password:
    environment: MBS_DATABASE_API_PASSWORD
  # WP2-AUTHN-01: externally-injected JWT signing key. Only the api service mounts it.
  jwt_signing_key:
    environment: MBS_JWT_SIGNING_KEY

volumes:
  postgres_data:
