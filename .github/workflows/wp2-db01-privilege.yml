name: WP2-DB-01 privilege boundary verification

on:
  push:
    branches:
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  wp2-db01-privilege-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Record actual checkout SHA
        run: |
          echo "ACTUAL_CHECKOUT_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Run WP2-DB-01 privilege boundary verification
        # MBS_DATABASE_BOOTSTRAP_PASSWORD / MIGRATOR / API are intentionally left unset here: the
        # script derives all three, self-consistently with its own non-disclosure sentinels, from
        # WP2DB01_SECRET_SENTINEL alone.
        env:
          WP2DB01_SECRET_SENTINEL: ${{ runner.temp }}-wp2db01-${{ github.run_id }}
        run: bash tests/wp2-db01/verify-privilege-boundary.sh

  wp2-db01-critical-mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Record actual checkout SHA
        run: |
          echo "ACTUAL_CHECKOUT_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Run WP2-DB-01 DB-PRIV-01 critical mutation verification
        env:
          WP2DB01_SECRET_SENTINEL: ${{ runner.temp }}-wp2db01-${{ github.run_id }}-mutation
        run: bash tests/wp2-db01/verify-mutations.sh
