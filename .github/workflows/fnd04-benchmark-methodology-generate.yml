name: FND-04 Benchmark Methodology Generator

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'agent/128-fnd04-benchmark-methodology'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out methodology branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply FND-03 retrospective and create FND-04 scaffold
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          def append_once(path: str, marker: str, block: str) -> None:
              p = root / path
              text = p.read_text(encoding='utf-8')
              if marker not in text:
                  if not text.endswith('\n'):
                      text += '\n'
                  text += '\n' + block.strip() + '\n'
                  p.write_text(text, encoding='utf-8')

          # 1) Implementation benchmark methodology
          p = root / 'docs/benchmarks/model-implementation-benchmark-methodology.md'
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '- Updated: 2026-08-08（Issue #40 FND-02の比較で得た再利用可能な検証知見を反映）',
              '- Updated: 2026-08-09（Issue #41 FND-03の実装・レビュー・Major修正benchmarkから得た知見を反映）'
          )
          p.write_text(text, encoding='utf-8')

          append_once(
              'docs/benchmarks/model-implementation-benchmark-methodology.md',
              '## 19. Candidate pool lifecycle',
              r'''
          ## 19. Candidate pool lifecycle

          FND-04以降、候補数を毎回固定せず、過去のrepository内benchmark実績からcandidate poolを事前に分類してよい。

          分類:

          - `active`: 直近複数Issueで安定した実装品質または比較価値があり、primary poolへ継続参加する。
          - `challenger`: 速度、異なるHarness、異なる設計傾向等の比較価値を持ち、少数枠で参加する。
          - `reserve`: 現runでは参加しないが、次回rotationや課題適性により再参加できる。
          - `suspended`: no-result、no-change、低品質、同種Majorの反復等により一時休止する。

          `suspended`は永久除外を意味しない。model version変更、Harness大幅更新、または定期calibration slotで再参加できる。

          推奨suspension signal:

          - 2回連続の`no_result / wrong_target / no-change / incomplete`
          - 直近3 implementation attemptのうち2回で60点未満
          - Issueの核心に関する同種Majorを複数回反復

          candidate poolは**実装開始前に**Issue別run identityへ固定し、結果を見て途中追加・除外しない。

          ## 20. Formal Self-Review experiment mode

          通常のAgent A責務としてのself-reviewは維持する。その上で、benchmarkでself-correction能力を測る場合は次の3段階を使用する。

          ```text
          H0 — Implementation Snapshot
            -> Formal Self-Review (SR)
            -> H1 — Self-Review Fix Snapshot
          ```

          ### H0

          - 共通baseから実装する。
          - 必須local verificationを実行する。
          - Draft PRを作成し、H0 full HeadとCIを固定する。
          - H0固定後は、SR開始までコードを変更しない。

          ### Formal Self-Review

          - 原則として同じModel + Harnessをfresh context / review-only modeで使用する。
          - 対象はH0 exact Headとする。
          - 他candidate、外部reviewer、Gold、score、rankingを参照しない。
          - review中はコードを変更しない。
          - `schemas/self-review-result.schema.json`と`templates/self-review-template.md`に従ってFindingを固定する。

          ### H1

          - Agent Aへ戻り、SR Findingを`accepted / rejected`へ分類する。
          - accepted Findingだけを修正し、rejected理由を記録する。
          - 必須verificationとCIを再実行し、H1 full Headを最終candidate snapshotとする。

          H0はH1の履歴から失われないようfull SHAをrun registryへ保持する。H0とH1の処理時間も分けて記録する。

          ### Self-Review metrics

          最終Coding Scoreは原則H1を主ランキングへ使用する。追加で次を別軸として記録する。

          - H0 Coding Score
          - H1 Coding Score
          - `Self-Review Gain = H1 - H0`
          - valid SR findings
          - SR false positives
          - accepted / rejected findings
          - fixed / unfixed valid findings
          - H1で新規導入したregression
          - self-review追加時間

          Self-Reviewの文章量やFinding件数自体は加点しない。

          ## 21. Assumption ledger and evaluator-only probes

          外部framework / library semanticsがIssueの正しさへ影響する場合、candidate実装開始前にIssue別`reference/assumption-ledger.md`へ前提を固定する。

          最低限:

          - dependency / version
          - 前提とする挙動
          - authoritative source
          - 必要ならruntime probe
          - その前提を誤ると影響するAC / failure path

          candidate自身のvisible testだけでは品質差を識別できない場合、evaluator-only adversarial probeを事前定義してよい。probeは全candidateへ同一条件で適用し、candidateがprobe内容を事前に知る必要はない。

          `green CI`は有効な証拠だが、未テストのfailure pathや外部dependency semanticsの正しさを自動的に証明しない。

          ## 22. Targeted fix round

          Final SynthesisまたはGold ReviewでMajorが確定した場合、全candidateを機械的に再実行することを標準としない。

          原則:

          - 上位implementation
          - 当該failure pathのtest / evidenceが強いcandidate
          - 異なる設計方式を代表するcandidate

          から**最大4候補程度**を事前選定してtargeted fix roundを行う。

          全candidate再実行が必要な場合は、研究上の理由をrun identityへ明記する。

          ## 23. Multi-dimensional capability record

          1つのTotalだけでModel + Harnessを説明しない。Issue別scoreとは別に、継続比較では次を独立記録する。

          - Implementation Quality
          - Self-Review Gain
          - External Review Quality
          - Gold Alignment
          - Execution Reliability
          - Time / Cost

          実装、failure proof、review、速度のbest candidateが異なることを許容する。

          ## 24. Product completion and benchmark archive separation

          productのMerge Ready / Issue Closeと、研究用benchmark archiveの完了は別gateとする。

          Final production implementationが通常のAgent B reviewを通過し、CI成功、merge、Issue closeまで完了した場合、次のproduct Issueの開始条件を満たす限り進行してよい。

          raw artifact整理、score report、annotated tag、candidate PR close、working branch cleanup等のarchive作業は別工程で実施できる。

          ただしarchive前にcandidate snapshotを失わないこと。archive規約のtag-before-delete順序は維持する。
          '''
          )

          # 2) Independent review protocol
          append_once(
              'docs/benchmarks/independent-review-benchmark-protocol.md',
              '## 16. FND-04 review-design improvements',
              r'''
          ## 16. FND-04 review-design improvements

          FND-03では17 reviewerすべてが後に確定したmerge-blocking root causeを見逃した。FND-04以降は、同一promptを多数へ複製するだけでなく**review roleの異質性**を事前設計する。

          ### 16.1 Reviewer role diversity

          標準reviewer poolは約6枠を目安とし、run identityへ各reviewerのprimary roleを固定する。

          代表role:

          - specification / scope
          - framework / official-source semantics
          - runtime / failure injection
          - test assurance / false assurance
          - minimality / maintainability
          - fast independent review

          同一reviewerが複数roleを兼ねてもよいが、全reviewerが同じ観点だけを見る構成を避ける。

          ### 16.2 Pre-locked assumption audit

          Gold作成前に、Issue別assumption ledgerの外部library / framework前提を一次sourceまたはruntime probeで監査する。

          Goldは可能な限りraw reviewer結果を読む前に固定する。後からGold revisionが必要になった場合は従来どおりrevision reasonを残し、`post_hoc_adjudication`等で明示する。

          ### 16.3 Real target and Controlled Mutant

          review能力測定では、必要に応じて2種類のtargetを分離する。

          - **Real target**: 実際のFinal Synthesis。未知の問題を探索し、product merge gateへ寄与する。
          - **Controlled Mutant**: 正しいsnapshotへ事前定義した欠陥を注入したreview専用target。TP / FP / FNとSeverity accuracyをpre-locked Goldで測る。

          Controlled Mutantはproduct branchへmergeしない。mutation specification / Goldはreviewer raw capture完了まで非公開とし、repository内のreviewer探索対象へ漏らさない。

          Real targetの未知findingとControlled Mutantの既知Gold scoreを同じ意味のTotalへ混ぜない。

          ### 16.4 Judge quorum

          最終adjudicationは原則2 Judgeから開始する。

          - reference verdictと主要root causeが一致: 2 Judgeでsynthesis可能
          - verdict、Blocker/Major、主要root cause、merge-ready candidateが不一致: 第3 Judgeを追加

          第3 Judgeを常設しない。追加理由をmanifestへ記録する。

          Judgeはraw scoreを単純平均せず、一次証拠でFindingを裁定する。

          ### 16.5 Best-effort identity masking

          Judgeへcandidateの過去rank / score /評判を与えない。可能な場合は評価sheet上でcandidateを`C-01`等へ匿名化し、採点完了後にModel + Harness identityへ戻す。

          GitHub branch / PR名からidentityが推測可能な場合は完全blindとは表現しない。
          '''
          )

          # 3) Archive convention improvements
          append_once(
              'docs/benchmarks/archive-conventions.md',
              '## 10. H0 / H1 snapshot handling',
              r'''
          ## 10. H0 / H1 snapshot handling

          Formal Self-Review modeを使用したcandidateでは、最終archive tagは原則H1へ付与する。

          H0は削除せず、run / manifestへfull SHAとして記録する。H0がH1のancestorとしてrepository historyから到達可能であることを確認する。

          H0を別tagへ固定する必要があるのは、history rewrite等で到達不能になる場合、またはH0自体を独立公開artifactとして扱う場合に限る。

          ## 11. Product completion is not blocked by research archive

          Final production PRのmerge / Issue close後、candidate archiveが未完了でも、次のproduct Issueの開始条件を満たしていれば進行してよい。

          archive作業は別のbenchmark operationとして実施する。ただし次を維持する。

          ```text
          expected Head確認
          -> annotated tag作成
          -> remote dereference確認
          -> manifest更新
          -> candidate PR unmerged Close
          -> candidate working branch削除
          ```

          product進行を優先することは、snapshot保全を省略する理由にはしない。

          ## 12. Archive automation

          候補数が多いbenchmarkでは、tag / dereference verification / PR close / branch cleanupを再利用可能なoperatorで自動化してよい。

          operatorは次を満たすこと。

          - mutation前に全candidate identityを検証する
          - tag mismatch時はfail closed
          - tag確認前にbranchを削除しない
          - candidate PRをmergeしない
          - final-code / artifact / archive branchをcandidate cleanupへ含めない
          - 一時的に権限を拡張したworkflow / scriptは作業後に除去する
          '''
          )

          # 4) New self-review schema/template
          schema = {
              "$schema": "https://json-schema.org/draft/2020-12/schema",
              "$id": "https://github.com/kooiei-in4a/minimal-bank-system/docs/benchmarks/schemas/self-review-result.schema.json",
              "title": "Formal Self-Review Benchmark Result",
              "type": "object",
              "additionalProperties": False,
              "required": ["schema_version", "benchmark_id", "run_id", "candidate", "h0", "reviewer", "attempt", "outcome", "findings"],
              "properties": {
                  "schema_version": {"const": "1.0"},
                  "benchmark_id": {"type": "string", "minLength": 1},
                  "run_id": {"type": "string", "minLength": 1},
                  "candidate": {
                      "type": "object", "additionalProperties": False,
                      "required": ["slug", "model", "harness"],
                      "properties": {
                          "slug": {"type": "string", "minLength": 1},
                          "model": {"type": "string", "minLength": 1},
                          "harness": {"type": "string", "minLength": 1},
                          "effort": {"type": ["string", "null"]}
                      }
                  },
                  "h0": {
                      "type": "object", "additionalProperties": False,
                      "required": ["head_sha"],
                      "properties": {
                          "head_sha": {"type": "string", "pattern": "^[0-9a-f]{40}$"},
                          "pr": {"type": ["integer", "null"], "minimum": 1},
                          "ci_run": {"type": ["integer", "null"], "minimum": 1}
                      }
                  },
                  "reviewer": {
                      "type": "object", "additionalProperties": False,
                      "required": ["model", "harness", "fresh_context"],
                      "properties": {
                          "model": {"type": "string", "minLength": 1},
                          "harness": {"type": "string", "minLength": 1},
                          "effort": {"type": ["string", "null"]},
                          "fresh_context": {"type": "boolean"}
                      }
                  },
                  "attempt": {"type": "integer", "minimum": 1},
                  "outcome": {"enum": ["completed", "failed", "stopped", "wrong_target", "no_result"]},
                  "findings": {
                      "type": "array",
                      "items": {
                          "type": "object", "additionalProperties": False,
                          "required": ["id", "severity", "blocking", "title", "description", "evidence", "confidence"],
                          "properties": {
                              "id": {"type": "string", "pattern": "^SR-[0-9]{2,}$"},
                              "severity": {"enum": ["Blocker", "Major", "Minor", "Nit"]},
                              "blocking": {"type": "boolean"},
                              "title": {"type": "string", "minLength": 1},
                              "description": {"type": "string", "minLength": 1},
                              "evidence": {"type": "array", "items": {"type": "string", "minLength": 1}},
                              "confidence": {"enum": ["high", "medium", "low"]},
                              "affected_component": {"type": ["string", "null"]},
                              "recommended_fix": {"type": ["string", "null"]}
                          }
                      }
                  },
                  "notes": {"type": ["string", "null"]}
              }
          }
          schema_path = root / 'docs/benchmarks/schemas/self-review-result.schema.json'
          schema_path.parent.mkdir(parents=True, exist_ok=True)
          schema_path.write_text(json.dumps(schema, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          template = '''# Formal Self-Review Result\n\n## Identity\n\n- Benchmark ID: `<benchmark-id>`\n- Run ID: `<run-id>`\n- Candidate: `<model> / <harness>`\n- H0 Head: `<40-char-sha>`\n- PR: `#<pr>`\n- H0 CI: `<run or N/A>`\n- Self-review attempt: `<n>`\n- Fresh context: `YES / NO`\n\n## Rules\n\n- Review H0 exact Head only.\n- Do not modify code during this phase.\n- Do not read other candidates, external reviewer results, Gold, rankings, or scores.\n- Treat implementation notes as secondary evidence.\n\n## Findings\n\n### SR-01 — <Severity> — <Title>\n\n- Blocking: `true | false`\n- Confidence: `high | medium | low`\n- Affected component: `<path/component or N/A>`\n- Description: `<root cause and impact>`\n- Evidence:\n  - `<file:line / runtime probe / CI / authoritative source>`\n- Recommended fix: `<concise fix or N/A>`\n\nRepeat only for meaningful findings.\n\n## Self-review verdict\n\n`NO CHANGE | FIX REQUIRED | BLOCKED | INCOMPLETE`\n\n## Notes\n\n- `<limitations or none>`\n\n---\n\nEmit a matching JSON result conforming to `../schemas/self-review-result.schema.json`.\n'''
          template_path = root / 'docs/benchmarks/templates/self-review-template.md'
          template_path.parent.mkdir(parents=True, exist_ok=True)
          template_path.write_text(template, encoding='utf-8')

          # 5) FND-04 scaffold
          fnd04 = root / 'docs/benchmarks/fnd04-model-comparison'
          (fnd04 / 'reference').mkdir(parents=True, exist_ok=True)

          readme = '''# FND-04 Model Comparison — Pre-Run Scaffold\n\nTarget Issue: #42 `[FND-04] EF Core・明示的migration実行基盤を確立する`\n\nStatus: **PREPARED / NOT STARTED**\n\nこのdirectoryはFND-04 benchmarkの実行条件をcandidate開始前に固定する。ここに結果やGoldを先書きしない。\n\n## Experiment shape\n\n```text\n8 candidates\n  H0 implementation snapshot\n    -> Formal Self-Review (fresh context, review-only)\n      -> H1 self-review fix snapshot\n        -> implementation evaluation\n          -> curated Final Synthesis\n            -> role-diverse independent review\n              -> 2 Judges (+ 1 conditional tie-breaker)\n                -> Formal Agent B review\n```\n\nMajorが確定した場合のtargeted fix roundは原則最大4候補とし、14候補全再実行を標準にしない。\n\n## Implementation candidate pool\n\n### Active core — 6\n\n1. GPT-5.6 Sol / Codex\n2. GPT-5.6 Terra / Codex\n3. GPT-5.6 Luna / Codex\n4. GPT-5.6 Luna / Open Code\n5. Claude Opus 5 / Claude Code\n6. Claude Sonnet 5 / Claude Code\n\n### Challengers — 2\n\n7. Grok 4.5 / Cursor — speed / alternative execution profile\n8. DeepSeek V4 Flash / Open Code — Open Code challenger / alternative failure-proof style\n\n### Reserve\n\n- Qwen3.7 Plus / Open Code\n- Composer 2.5 / Cursor\n- DeepSeek V4 Pro / Open Code\n\n### Suspended for this run\n\n- MiniMax M3 / Open Code\n- MiMo-V2.5 / Open Code\n- MiMo-V2.5-Pro / Open Code\n\nSuspension is not permanent exclusion. See the parent methodology for re-entry rules.\n\n## Reviewer pool — 6 roles\n\n| Slot | Model + Harness | Primary role |\n| --- | --- | --- |\n| R1 | GPT-5.6 Sol / Codex | runtime / failure-path |\n| R2 | Claude Opus 5 / Claude Code | deep technical / test assurance |\n| R3 | Claude Sonnet 5 / Claude Code | specification / scope |\n| R4 | ChatGPT Opus 5.6 Sol / Browser | framework / official-source cross-check |\n| R5 | GPT-5.6 Luna / Open Code | tool-driven independent review |\n| R6 | Grok 4.5 / Cursor | fast independent review |\n\nExact product-visible model identity and effort are re-verified immediately before reviewer execution and recorded in `run.json`; a changed/unavailable product label is not silently substituted.\n\n## Judge quorum\n\n- Judge A: GPT-5.6 Sol / Codex\n- Judge B: Claude Opus 5 / Claude Code\n- Conditional Judge C: GPT-5.6 Pro / Browser\n\nJudge C is used only if the first two Judges disagree on reference verdict, blocking root cause, or merge-ready candidate.\n\n## Review targets\n\n- Real target: actual FND-04 Final Synthesis\n- Controlled Mutant: optional reviewer-capability target with pre-locked Gold; mutation details remain collector-private until raw reviews are fixed\n\n## Pre-run gates\n\n- [ ] Issue #42 Issue Ready = PASS\n- [ ] common base full SHA fixed\n- [ ] all 8 candidate branches created from common base\n- [ ] package/version contract fixed\n- [ ] `reference/assumption-ledger.md` locked\n- [ ] candidate prompt revision fixed\n- [ ] self-review prompt revision fixed\n- [ ] scoring rubric fixed\n- [ ] evaluator-only probe plan fixed\n- [ ] no candidate execution started\n\n## Files\n\n- `run.json`: machine-readable pre-run identity\n- `reference/assumption-ledger.md`: external-library and project assumptions locked before candidate outputs\n\nBenchmark execution must not start while status is `PREPARED / NOT STARTED`.\n'''
          (fnd04 / 'README.md').write_text(readme, encoding='utf-8')

          run = {
              "schema_version": "1.0",
              "benchmark_id": "fnd04-implementation-self-review",
              "repository": "kooiei-in4a/minimal-bank-system",
              "target_issue": 42,
              "status": "prepared_not_started",
              "common_base_sha": None,
              "prompt_revision": None,
              "self_review_prompt_revision": None,
              "workflow": ["H0", "formal_self_review", "H1", "implementation_evaluation", "final_synthesis", "independent_review", "judge_adjudication", "formal_agent_b"],
              "implementation_candidates": [
                  {"slug":"gpt-5.6-sol-codex","model":"GPT-5.6 Sol","harness":"Codex","pool":"active"},
                  {"slug":"gpt-5.6-terra-codex","model":"GPT-5.6 Terra","harness":"Codex","pool":"active"},
                  {"slug":"gpt-5.6-luna-codex","model":"GPT-5.6 Luna","harness":"Codex","pool":"active"},
                  {"slug":"gpt-5.6-luna-opencode","model":"GPT-5.6 Luna","harness":"Open Code","pool":"active"},
                  {"slug":"claude-opus-5-claude-code","model":"Claude Opus 5","harness":"Claude Code","pool":"active"},
                  {"slug":"claude-sonnet-5-claude-code","model":"Claude Sonnet 5","harness":"Claude Code","pool":"active"},
                  {"slug":"grok-4.5-cursor","model":"Grok 4.5","harness":"Cursor","pool":"challenger"},
                  {"slug":"deepseek-v4-flash-opencode","model":"DeepSeek V4 Flash","harness":"Open Code","pool":"challenger"}
              ],
              "reserve": ["qwen3.7-plus-opencode", "composer-2.5-cursor", "deepseek-v4-pro-opencode"],
              "suspended": ["minimax-m3-opencode", "mimo-v2.5-opencode", "mimo-v2.5-pro-opencode"],
              "reviewer_slots": 6,
              "judge_quorum": {"initial":2,"conditional_tiebreaker":1},
              "targeted_fix_max_candidates": 4,
              "controlled_mutant": {"planned": True, "gold_publish_before_raw_capture": False}
          }
          (fnd04 / 'run.json').write_text(json.dumps(run, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          assumptions = '''# FND-04 Pre-Run Assumption Ledger\n\nStatus: **DRAFT FOR ISSUE-READY LOCK / NO CANDIDATE OUTPUT READ**\n\nこの文書はcandidate実装を見る前に、FND-04の外部library semanticsとproject-owned実装境界を固定する。Issue #42とAccepted ADRが優先する。\n\n## A-01 — EF Core stable line\n\n- Microsoft EF Core packages: `10.0.10`\n- `dotnet-ef`: `10.0.10` repo-local toolとして固定する想定\n- Source checked: Microsoft / NuGet, 2026-08-09\n\nMicrosoft EF Core packagesは同一patch lineへ揃える。preview 11.xを使用しない。\n\n## A-02 — Npgsql provider line\n\n- `Npgsql`: repository既存 `10.0.3`\n- `Npgsql.EntityFrameworkCore.PostgreSQL`: `10.0.3`\n- Source checked: Npgsql / NuGet, 2026-08-09\n\n## A-03 — Migration-only schema evolution\n\nAccepted ADR-0009により、application-owned schema evolutionはEF Core migrationsのみ。`EnsureCreated`やnormal API startupのad-hoc DDLを代替に使用しない。\n\n## A-04 — Explicit migrator\n\nNormal API startupとmigration executionを分離する。FND-04ではdedicated one-shot migrator entry pointを成立させ、FND-05がCompose orderingへ接続する。\n\n## A-05 — Empty foundation baseline\n\nFND-04はbusiness schemaを所有しないため、baseline migrationはempty application migrationを許可・要求する。\n\n- application business table / sequence / triggerを作らない\n- `Up` / `Down`へbusiness DDLを入れない\n- apply後にEF migration historyへbaselineが記録されることをもってmachineryを検証する\n\n最初のnon-empty business migrationは将来のschema-owning Issueが所有する。\n\n## A-06 — Pending model changes\n\nEF Core 10では `dotnet ef migrations has-pending-model-changes` と programmatic `HasPendingModelChanges()` が利用可能。標準drift checkは実際にこの機能へ到達する必要がある。\n\nEvaluator-only probeでは、一時的なmodel-only changeを作り、drift command/testがFAILすることを確認して変更を破棄する。candidate repositoryへsynthetic business entityを残さない。\n\n## A-07 — Migrate with pending changes\n\nEF Core 9以降、pending model changesがある状態の`Migrate/MigrateAsync`は例外となる。この挙動を無効化してgreenにする設定を標準採用しない。\n\n## A-08 — EnsureCreated incompatibility\n\n`EnsureCreated/EnsureCreatedAsync`はMigrationsを迂回するため、application schema evolutionの検証へ使用しない。\n\n## A-09 — Real PostgreSQL evidence\n\nFND-03で確立したPostgreSQL 18.4 fixtureを再利用する。clean apply / failure / no-auto-migration verificationをSQLite/InMemoryへ置換しない。\n\n## A-10 — API startup no-migration proof\n\nclean PostgreSQLへAPIを通常起動しても、migration historyまたはapplication schemaが勝手に変化しないことをbefore/afterで確認する。単に`Program.cs`に`Migrate`文字列がないことだけを証拠にしない。\n\n## A-11 — Failure propagation\n\nexplicit migratorのconnection / migration failureは成功扱いにしない。process exit / exception / CI結果でfail-closedを確認する。\n\n## A-12 — Bounded migration execution\n\nADR-0009のbounded timeout要求を維持する。無期限hangを許容しない。timeout値そのものはIssue #42の実装契約で固定する。\n\n## A-13 — Idempotent SQL evidence\n\nADR-0009に従い、EF Coreが対象rangeで生成可能なidempotent migration SQLをreview / release evidenceとして生成できる経路を確認する。FND-04ではempty baselineでもmachinery成立を確認する。\n\n## Lock rule\n\nこのledgerをcandidate結果を見た後で有利不利に変更しない。変更が必要な場合はrevision reasonを記録し、全candidateへ同一適用する。\n'''
          (fnd04 / 'reference' / 'assumption-ledger.md').write_text(assumptions, encoding='utf-8')

          # 6) Benchmark index updates
          p = root / 'docs/benchmarks/README.md'
          text = p.read_text(encoding='utf-8')
          if '- `schemas/self-review-result.schema.json`' not in text:
              text = text.replace('- `schemas/review-benchmark-manifest.schema.json`\n', '- `schemas/review-benchmark-manifest.schema.json`\n- `schemas/self-review-result.schema.json`\n')
          if '- `templates/self-review-template.md`' not in text:
              text = text.replace('- `templates/review-benchmark-prompt-preamble.md`\n', '- `templates/review-benchmark-prompt-preamble.md`\n- `templates/self-review-template.md`\n')
          if '- `fnd04-model-comparison/README.md`' not in text:
              anchor = '  - final production outcome\n'
              text = text.replace(anchor, anchor + '- `fnd04-model-comparison/README.md`\n  - PREPARED / NOT STARTED\n  - 8 implementation candidates\n  - H0 -> Formal Self-Review -> H1\n  - role-diverse review / 2+1 Judge quorum\n')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit generated benchmark methodology changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/benchmarks
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m "docs(benchmark): apply FND-03 retrospective [bench-methodology-generated]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
