name: WP2-AUTHZ-01 fallback authorization verification

on:
  push:
    branches:
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  fallback-authorization-critical-mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Record actual checkout SHA
        run: |
          echo "ACTUAL_CHECKOUT_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MinimalBankSystem.slnx --verbosity minimal

      - name: Restore local tools
        run: dotnet tool restore

      - name: Run AUTHZ-STATE-01/02/03 semantic critical mutations
        run: bash tests/wp2-authz01/verify-mutations.sh
