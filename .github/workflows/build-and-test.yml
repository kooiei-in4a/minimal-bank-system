name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: dotnet restore
        run: dotnet restore

      - name: dotnet build
        run: dotnet build

      - name: dotnet test
        run: dotnet test
