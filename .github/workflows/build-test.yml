name: Build and test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore MinimalBankSystem.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format MinimalBankSystem.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build MinimalBankSystem.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MinimalBankSystem.slnx --configuration Release --no-build
