name: Build and test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore MinimalBankSystem.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format MinimalBankSystem.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build MinimalBankSystem.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MinimalBankSystem.slnx --configuration Release --no-build
