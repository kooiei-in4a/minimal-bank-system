name: Build and Test

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    # Includes real PostgreSQL Testcontainers pulls/startup for Category=PostgreSql.
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # Same command locally and in CI. PostgreSQL provider tests use Testcontainers
      # (Category=PostgreSql). Container/start/connect failures fail the job; no
      # InMemory/SQLite fallback.
      - name: Test
        run: dotnet test --no-build
