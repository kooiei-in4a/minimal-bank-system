name: Build and Test

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MinimalBankSystem.slnx --verbosity minimal

      - name: Build
        run: dotnet build MinimalBankSystem.slnx --no-restore --verbosity minimal

      - name: Test (non-PostgreSQL)
        run: dotnet test MinimalBankSystem.slnx --no-build --filter "Category!=PostgreSqlIntegration"

      - name: Test (real PostgreSQL)
        run: dotnet test tests/MinimalBankSystem.IntegrationTests/MinimalBankSystem.IntegrationTests.csproj --no-build --filter "Category=PostgreSqlIntegration"

  fnd03-archive:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/fnd03-benchmark-archive-run-pr'
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Run FND-03 archive operator
        run: bash .github/scripts/fnd03-archive.sh
