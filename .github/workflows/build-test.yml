name: Build and Test

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # The PostgreSQL integration tests need a container runtime. Failing here keeps an
      # unavailable runtime from looking like a test problem, and never turns it into a pass.
      - name: Verify the container runtime
        run: docker version

      # Pulling by digest makes the pin visible in the CI log and keeps the first container start
      # from competing with the image download. PostgresTestPolicyTests asserts that this
      # reference stays identical to PostgresTestImage.Reference.
      - name: Pull the pinned PostgreSQL image
        run: docker pull postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a

      # One command for the whole solution, identical to the local one. It includes the real
      # PostgreSQL integration tests; they are never filtered out of CI.
      - name: Test
        run: dotnet test --no-build
