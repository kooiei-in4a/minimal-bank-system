name: Build and Test

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MinimalBankSystem.slnx --verbosity minimal

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build MinimalBankSystem.slnx --no-restore --verbosity minimal

      - name: Verify no pending EF model changes
        run: dotnet tool run dotnet-ef migrations has-pending-model-changes --project src/MinimalBankSystem.Infrastructure --startup-project src/MinimalBankSystem.Migrator --no-build

      - name: Test (non-PostgreSQL)
        run: dotnet test MinimalBankSystem.slnx --no-build --filter "Category!=PostgreSqlIntegration"

      - name: Test (real PostgreSQL)
        run: dotnet test tests/MinimalBankSystem.IntegrationTests/MinimalBankSystem.IntegrationTests.csproj --no-build --filter "Category=PostgreSqlIntegration"

      - name: Validate Docker Compose configuration
        env:
          MBS_DATABASE_PASSWORD: fnd05-ci-sentinel
        run: docker compose -p minimal-bank-system-fnd05 config --quiet

      - name: Verify Docker Compose execution contract
        env:
          MBS_DATABASE_PASSWORD: fnd05-ci-sentinel
        run: bash scripts/fnd05/verify-compose.sh
