name: .NET

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MinimalBankSystem.slnx

      - name: Build
        run: dotnet build MinimalBankSystem.slnx --no-restore

      - name: Test
        run: dotnet test MinimalBankSystem.slnx --no-build --no-restore
